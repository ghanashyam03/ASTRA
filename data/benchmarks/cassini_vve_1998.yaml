version: "1.0"
mission_id: "cassini_vve_1998_validation"

spacecraft:
  name: "Cassini"
  dry_mass_kg: 2520.0
  fuel_mass_kg: 3132.0
  propulsion:
    type: chemical
    isp_seconds: 340.0
    thrust_newtons: 445.0

trajectory:
  origin:
    body: Earth
    orbit:
      type: circular
      altitude_km: 300.0
  destination:
    body: Saturn
    orbit:
      type: circular
      altitude_km: 100000.0  # Simplified placeholder circular orbit (Cassini's actual insertion was highly complex)

multi_body_trajectory:
  origin:
    body: Earth
    orbit:
      type: circular
      altitude_km: 300.0
  destination:
    body: Saturn
    orbit:
      type: circular
      altitude_km: 100000.0
  flyby_sequence:
    - body: VENUS
      min_periapsis_alt_km: 200.0
      max_periapsis_alt_km: 20000.0
      powered_burn_allowed: false
    - body: VENUS
      min_periapsis_alt_km: 200.0
      max_periapsis_alt_km: 20000.0
      powered_burn_allowed: false
    - body: EARTH
      min_periapsis_alt_km: 500.0
      max_periapsis_alt_km: 20000.0
      powered_burn_allowed: true
      max_powered_burn_km_s: 0.3
  dsm_budget_km_s: 1.0      # Generously set to approximate correction maneuvers (e.g. TCMs) and planetary targeting adjustments
  max_revs_per_leg: 0

launch_window:
  start: "1997-10-01T00:00:00Z"
  end: "1997-10-31T00:00:00Z"
  resolution_days: 1
  tof_min_days: 30
  tof_max_days: 200

constraints:
  - type: max_delta_v
    value_km_s: 8.0
    hard: true
  - type: max_duration
    value_days: 2800    # ~7.6 years, covers the actual ~6.7 years cruise phase
    hard: true

objectives:
  - metric: delta_v_total
    direction: minimize
    weight: 1.0

physics:
  models: [patched_conics]
  ephemeris: DE440

optimization:
  strategy: bayesian
  budget:
    max_evaluations: 2000
    time_limit_seconds: 240
  seed: 7
